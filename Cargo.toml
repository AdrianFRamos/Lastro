[workspace]
resolver = "3"
members = [
    "crates/lastro-protocol",
    "services/agent",
    "services/api",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.22"
bytes = "1"
crc32c = "0.6"
hex = "0.4"
http = "1"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
solana-pubkey = { version = "=4.1.0", default-features = false, features = ["curve25519", "std"] }
sha2 = "0.10"
subtle = "=2.6.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync", "fs", "io-util"] }
tokio-serial = "5"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
