services:
  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lastro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lastro}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - lastro-postgres:/var/lib/postgresql

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      LASTRO_API_BIND: 0.0.0.0:8080
      LASTRO_DATABASE_URL: postgres://${POSTGRES_USER:-lastro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lastro}
      LASTRO_SOLANA_RPC_URL: ${LASTRO_SOLANA_RPC_URL:?set LASTRO_SOLANA_RPC_URL}
      LASTRO_PROGRAM_ID: ${LASTRO_PROGRAM_ID:?set LASTRO_PROGRAM_ID}
      LASTRO_DEPLOYMENT_ID_HEX: ${LASTRO_DEPLOYMENT_ID_HEX:?set LASTRO_DEPLOYMENT_ID_HEX}
      LASTRO_STATION_PUBKEY_HEX: ${LASTRO_STATION_PUBKEY_HEX:?set LASTRO_STATION_PUBKEY_HEX}
      LASTRO_AGENT_TOKEN: ${LASTRO_AGENT_TOKEN:?set LASTRO_AGENT_TOKEN}
      LASTRO_OPERATOR_TOKEN: ${LASTRO_OPERATOR_TOKEN:?set LASTRO_OPERATOR_TOKEN}
      RUST_LOG: ${RUST_LOG:-info,lastro_api=info}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL}
        VITE_SOLANA_RPC_URL: ${VITE_SOLANA_RPC_URL:?set VITE_SOLANA_RPC_URL}
        VITE_SOLANA_CHAIN: ${VITE_SOLANA_CHAIN:?set VITE_SOLANA_CHAIN}
        VITE_LASTRO_PROGRAM_ID: ${VITE_LASTRO_PROGRAM_ID:?set VITE_LASTRO_PROGRAM_ID}
        VITE_LASTRO_DEPLOYMENT_ID_HEX: ${VITE_LASTRO_DEPLOYMENT_ID_HEX:?set VITE_LASTRO_DEPLOYMENT_ID_HEX}
        VITE_LASTRO_AUTHORITY: ${VITE_LASTRO_AUTHORITY:?set VITE_LASTRO_AUTHORITY}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_started

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started

volumes:
  lastro-postgres:
  caddy-data:
  caddy-config:
