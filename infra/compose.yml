services:
  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: lastro
      POSTGRES_PASSWORD: lastro
      POSTGRES_DB: lastro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastro -d lastro"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - lastro-postgres:/var/lib/postgresql/data

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      LASTRO_API_BIND: 0.0.0.0:8080
      LASTRO_DATABASE_URL: postgres://lastro:lastro@postgres:5432/lastro
      LASTRO_SOLANA_RPC_URL: ${LASTRO_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      LASTRO_PROGRAM_ID: ${LASTRO_PROGRAM_ID:?set LASTRO_PROGRAM_ID}
      LASTRO_DEPLOYMENT_ID_HEX: ${LASTRO_DEPLOYMENT_ID_HEX:?set LASTRO_DEPLOYMENT_ID_HEX}
      LASTRO_STATION_PUBKEY_HEX: ${LASTRO_STATION_PUBKEY_HEX:?set LASTRO_STATION_PUBKEY_HEX}
      LASTRO_AGENT_TOKEN: ${LASTRO_AGENT_TOKEN:?set LASTRO_AGENT_TOKEN}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL}
        VITE_SOLANA_RPC_URL: ${VITE_SOLANA_RPC_URL:?set VITE_SOLANA_RPC_URL}
        VITE_SOLANA_CHAIN: ${VITE_SOLANA_CHAIN:?set VITE_SOLANA_CHAIN}
        VITE_LASTRO_PROGRAM_ID: ${VITE_LASTRO_PROGRAM_ID:?set VITE_LASTRO_PROGRAM_ID}
    ports: ["8088:80"]
    depends_on: [api]

  hardware-simulator:
    profiles: ["hardware-sim"]
    build:
      context: ..
      dockerfile: hardware-simulator/Dockerfile
    environment:
      LASTRO_HARDWARE_SIM_HTTP_BIND: 0.0.0.0:8090
      LASTRO_HARDWARE_SIM_WIRE_BIND: 0.0.0.0:9100
    ports:
      - "127.0.0.1:8090:8090"
    expose:
      - "9100"

  hardware-simulator-agent:
    profiles: ["hardware-sim"]
    build:
      context: ..
      dockerfile: hardware-simulator/Dockerfile.agent-bridge
    environment:
      LASTRO_AGENT_API_URL: http://api:8080
      LASTRO_AGENT_TOKEN: ${LASTRO_AGENT_TOKEN:?set LASTRO_AGENT_TOKEN}
      LASTRO_AGENT_SERIAL_PORT: /tmp/lastro-station
      LASTRO_AGENT_SERIAL_BAUD: "115200"
      LASTRO_STATION_PUBKEY_HEX: ${LASTRO_STATION_PUBKEY_HEX:?set LASTRO_STATION_PUBKEY_HEX}
      LASTRO_AGENT_SQLITE_URL: sqlite:///data/agent.db?mode=rwc
      LASTRO_AGENT_POLL_INTERVAL_MS: "500"
      LASTRO_AGENT_REQUEST_TIMEOUT_MS: "5000"
      LASTRO_HARDWARE_SIM_WIRE_HOST: hardware-simulator
      LASTRO_HARDWARE_SIM_WIRE_PORT: "9100"
      RUST_LOG: ${RUST_LOG:-info,lastro_agent=debug}
    depends_on:
      api: { condition: service_started }
      hardware-simulator: { condition: service_healthy }
    restart: on-failure
    volumes:
      - lastro-agent-sim:/data

volumes:
  lastro-postgres:
  lastro-agent-sim:
