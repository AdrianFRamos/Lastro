[package]
name = "lastro-v2"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "lastro_v2"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
lastro-protocol = { path = "../../../crates/lastro-protocol" }
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sha2 = "0.10"
solana-sdk-ids = "=3.1.0"
solana-instructions-sysvar = "=3.0.1"

[dev-dependencies]
hex = "0.4"
litesvm = { version = "=0.16.0", features = ["precompiles"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
solana-compute-budget-interface = "=3.0.0"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-pubkey = "=4.2.1"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = { version = "=4.1.6", features = ["wincode"] }
wincode = "=0.5.5"
