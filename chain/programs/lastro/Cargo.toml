[package]
name = "lastro"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "lastro"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.2.0"
sha2 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
solana-secp256r1-program = "=3.0.0"

[dev-dependencies]
hex = "0.4"
lastro-protocol = { path = "../../../crates/lastro-protocol" }
litesvm = { version = "=0.15.2", features = ["precompiles"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-pubkey = "=4.2.1"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = { version = "=4.1.6", features = ["wincode"] }
wincode = "=0.5.5"
