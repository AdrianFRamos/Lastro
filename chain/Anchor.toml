[toolchain]
anchor_version = "1.2.0"
solana_version = "4.2.0"
package_manager = "npm"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[test]
skip_local_validator = true

[scripts]
test = "cargo test --locked --workspace"

[workspace]
members = ["programs/*"]

[programs.localnet]
lastro_v2 = "9hYgxhMCrkmasqW99qRaBxSndaFqkgZqwojSmnB9Ab3h"

# Anchor 1.2 uses LiteSVM as the default test direction. Program ID is generated/synced
# when the actual deploy keypair is created; keypairs remain gitignored.
