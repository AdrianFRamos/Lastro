name: ci
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-and-spec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env: { POSTGRES_USER: lastro, POSTGRES_PASSWORD: lastro, POSTGRES_DB: lastro }
        ports: [5434:5432]
        options: >-
          --health-cmd "pg_isready -U lastro -d lastro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:bookworm-20260918-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            sh -c "chown -R ${uid}:${gid} /workspace"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # secret-history audit requires complete reachable history
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.13.15' }
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/spec_check.py
      - run: python scripts/check_vectors.py --verify-only
      - name: Run deterministic Python repository and system-harness tests
        run: >-
          python -m pytest -q
          tests/repository
          tests/system/test_support.py
          tests/system/test_e2e_controller.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
        env: { LASTRO_DATABASE_URL: postgres://lastro:lastro@127.0.0.1:5434/lastro }

  web:
    runs-on: ubuntu-latest
    env:
      # Public test-only build configuration. Never use this program id for a deployment.
      VITE_API_BASE_URL: http://127.0.0.1:8080
      VITE_SOLANA_RPC_URL: https://api.devnet.solana.com
      VITE_SOLANA_CHAIN: solana:devnet
      VITE_LASTRO_PROGRAM_ID: 'Vote111111111111111111111111111111111111111'
      VITE_LASTRO_AUTHORITY: 'Vote111111111111111111111111111111111111111'
      VITE_LASTRO_DEPLOYMENT_ID_HEX: d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:bookworm-20260918-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            sh -c "chown -R ${uid}:${gid} /workspace"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24.21.0' }
      - name: Verify pinned Node and npm
        run: |
          node --version | grep -Fx 'v24.21.0'
          npm --version | grep -Fx '11.19.0'
      - name: Install locked web dependencies
        run: |
          test -f package-lock.json
          npm ci
      - run: npm --workspace @lastro/web run format:check
      - run: npm --workspace @lastro/web run typecheck
      - run: npm --workspace @lastro/web run test
      - run: npm --workspace @lastro/web run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:bookworm-20260918-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            sh -c "chown -R ${uid}:${gid} /workspace"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24.21.0' }
      - name: Verify pinned Node and npm
        run: |
          node --version | grep -Fx 'v24.21.0'
          npm --version | grep -Fx '11.19.0'
      - name: Install pinned RustSec cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit root Rust lockfile
        run: cargo audit --file Cargo.lock
      - name: Audit chain Rust lockfile
        run: cargo audit --file chain/Cargo.lock --ignore RUSTSEC-2022-0093 --ignore RUSTSEC-2024-0344
      - name: Audit Node runtime dependencies from committed lockfile
        run: npm audit --package-lock-only --omit=dev --audit-level=low
      - name: Audit complete Node dependency graph from committed lockfile
        run: npm audit --package-lock-only --audit-level=low
