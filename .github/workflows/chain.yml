name: chain
on:
  push:
    paths: ['chain/**','crates/lastro-protocol/**','rust-toolchain.toml','scripts/bootstrap_program_id.sh','scripts/install_pinned_solana_cli.sh','scripts/install_pinned_anchor_cli.sh','.github/workflows/chain.yml']
  pull_request:
    paths: ['chain/**','crates/lastro-protocol/**','rust-toolchain.toml','scripts/bootstrap_program_id.sh','scripts/install_pinned_solana_cli.sh','scripts/install_pinned_anchor_cli.sh','.github/workflows/chain.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:bookworm-20260918-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            sh -c "chown -R ${uid}:${gid} /workspace"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - name: Install checksum-pinned Anchor and Solana toolchain
        run: |
          ANCHOR_BIN="$(bash scripts/install_pinned_anchor_cli.sh)"
          SOLANA_BIN="$(bash scripts/install_pinned_solana_cli.sh)"
          export PATH="$ANCHOR_BIN:$SOLANA_BIN:$PATH"
          anchor --version | grep -Fx 'anchor-cli 1.2.0'
          solana --version | grep -E '^solana-cli 4\.2\.0([[:space:]]|$)'
          echo "$ANCHOR_BIN" >> "$GITHUB_PATH"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"

      - name: Bootstrap ephemeral CI program identity when source is still uninitialized
        run: |
          if grep -q 'LASTRO_PROGRAM_ID_BOOTSTRAP_MARKER' chain/programs/lastro/src/lib.rs; then
            bash scripts/bootstrap_program_id.sh --ephemeral-ci
          fi
      - name: Require committed nested Cargo lock
        run: test -f chain/Cargo.lock
      - name: Rust format
        run: cargo fmt --manifest-path chain/Cargo.toml --all -- --check
      - name: Rust clippy
        run: cargo clippy --locked --manifest-path chain/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Build Anchor program
        run: |
          cd chain
          anchor build --ignore-keys
          git diff --exit-code -- Cargo.lock
      - name: Run LiteSVM program tests
        run: cargo test --locked --manifest-path chain/Cargo.toml --workspace
