name: devnet
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: devnet
    services:
      postgres:
        image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_USER: lastro
          POSTGRES_PASSWORD: lastro
          POSTGRES_DB: lastro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lastro -d lastro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LASTRO_DATABASE_URL: postgres://lastro:lastro@127.0.0.1:5432/lastro
      LASTRO_API_BIND: 127.0.0.1:8080
      LASTRO_SYSTEM_API_URL: http://127.0.0.1:8080
      LASTRO_PROGRAM_ID: ${{ vars.LASTRO_DEVNET_PROGRAM_ID }}
      LASTRO_DEPLOYMENT_ID_HEX: ${{ vars.LASTRO_DEVNET_DEPLOYMENT_ID_HEX }}
      LASTRO_STATION_PUBKEY_HEX: ${{ vars.LASTRO_DEVNET_STATION_PUBKEY_HEX }}
      LASTRO_SOLANA_RPC_URL: ${{ secrets.LASTRO_DEVNET_RPC_URL }}
      LASTRO_SYSTEM_SOLANA_RPC_URL: ${{ secrets.LASTRO_DEVNET_RPC_URL }}
      LASTRO_AGENT_TOKEN: ${{ secrets.LASTRO_AGENT_TOKEN }}
      LASTRO_SYSTEM_STATION_PRIVATE_SCALAR_HEX: ${{ secrets.LASTRO_DEVNET_STATION_PRIVATE_SCALAR_HEX }}
      LASTRO_SYSTEM_TEST: '1'
      LASTRO_DEVNET_TEST: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: '1.98.1'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'

      - name: Validate required Devnet configuration
        env:
          WALLET_A_JSON: ${{ secrets.LASTRO_DEVNET_WALLET_A_KEYPAIR_JSON }}
          WALLET_B_JSON: ${{ secrets.LASTRO_DEVNET_WALLET_B_KEYPAIR_JSON }}
          WALLET_C_JSON: ${{ secrets.LASTRO_DEVNET_WALLET_C_KEYPAIR_JSON }}
        run: |
          for name in             LASTRO_PROGRAM_ID             LASTRO_DEPLOYMENT_ID_HEX             LASTRO_STATION_PUBKEY_HEX             LASTRO_SOLANA_RPC_URL             LASTRO_AGENT_TOKEN             LASTRO_SYSTEM_STATION_PRIVATE_SCALAR_HEX             WALLET_A_JSON             WALLET_B_JSON             WALLET_C_JSON
          do
            [[ -n "${!name:-}" ]] || { echo "Missing required Devnet configuration: $name" >&2; exit 1; }
          done

      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Install pinned Solana CLI
        run: |
          cargo install --git https://github.com/otter-sec/anchor --rev 84a63f9f7112b23581816436fbcf3f6c515779f9 avm --locked --force
          avm install 1.2.0
          avm use 1.2.0
          cd chain
          avm solana install
          solana --version | grep -E '^solana-cli 4\.1\.2([[:space:]]|$)'
          echo "$(dirname "$(command -v solana)")" >> "$GITHUB_PATH"

      - name: Materialize ephemeral workflow copies of Devnet wallets
        env:
          WALLET_A_JSON: ${{ secrets.LASTRO_DEVNET_WALLET_A_KEYPAIR_JSON }}
          WALLET_B_JSON: ${{ secrets.LASTRO_DEVNET_WALLET_B_KEYPAIR_JSON }}
          WALLET_C_JSON: ${{ secrets.LASTRO_DEVNET_WALLET_C_KEYPAIR_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          for label in ("A", "B", "C"):
              value = json.loads(os.environ[f"WALLET_{label}_JSON"])
              if not isinstance(value, list) or len(value) != 64 or any(
                  not isinstance(item, int) or not 0 <= item <= 255 for item in value
              ):
                  raise SystemExit(f"Wallet {label} secret must be a Solana keypair JSON array of 64 bytes")
              path = root / f"lastro-devnet-wallet-{label.lower()}.json"
              path.write_text(json.dumps(value, separators=(",", ":")))
              path.chmod(0o600)
          PY
          echo "LASTRO_SYSTEM_WALLET_A_KEYPAIR=$RUNNER_TEMP/lastro-devnet-wallet-a.json" >> "$GITHUB_ENV"
          echo "LASTRO_SYSTEM_WALLET_B_KEYPAIR=$RUNNER_TEMP/lastro-devnet-wallet-b.json" >> "$GITHUB_ENV"
          echo "LASTRO_SYSTEM_WALLET_C_KEYPAIR=$RUNNER_TEMP/lastro-devnet-wallet-c.json" >> "$GITHUB_ENV"
          echo "LASTRO_DEVNET_ARTIFACT_DIR=$RUNNER_TEMP/lastro-devnet-artifacts" >> "$GITHUB_ENV"

      - name: Build Agent and API
        run: |
          cargo build --locked -p lastro-agent -p lastro-api
          echo "LASTRO_SYSTEM_AGENT_BIN=$GITHUB_WORKSPACE/target/debug/lastro-agent" >> "$GITHUB_ENV"

      - name: Validate deployed program and ProtocolConfig
        run: |
          scripts/devnet_smoke.sh
          python scripts/initialize_protocol_config.py             --rpc-url "$LASTRO_SOLANA_RPC_URL"             --program-id "$LASTRO_PROGRAM_ID"             --deployment-id-hex "$LASTRO_DEPLOYMENT_ID_HEX"             --station-pubkey-hex "$LASTRO_STATION_PUBKEY_HEX"             --validate-only

      - name: Start API against Devnet
        run: |
          target/debug/lastro-api >"$RUNNER_TEMP/lastro-devnet-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/lastro-devnet-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$LASTRO_SYSTEM_API_URL/api/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/lastro-devnet-api.log"
          exit 1

      - name: Run G4 Devnet flow and stale-custodian rejection
        run: python -m pytest -q tests/system/test_devnet.py

      - name: Upload Devnet validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lastro-devnet-validation
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/lastro-devnet-artifacts
            ${{ runner.temp }}/lastro-devnet-api.log

      - name: Stop API
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/lastro-devnet-api.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/lastro-devnet-api.pid")" 2>/dev/null || true
          fi
