name: maintenance-sync
on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:bookworm-20260918-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            sh -c "chown -R ${uid}:${gid} /workspace"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.13.15' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Verify pinned Node and npm
        run: |
          node --version | grep -Fx 'v24.21.0'
          npm --version | grep -Fx '11.19.0'
      - name: Generate committed dependency locks
        run: |
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path chain/Cargo.toml
          npm install --package-lock-only --ignore-scripts
      - name: Format Rust workspaces
        run: |
          cargo fmt --all
          cargo fmt --manifest-path chain/Cargo.toml --all
      - name: Format browser workspace from the committed dependency graph
        run: |
          npm ci
          npm --workspace @lastro/web exec -- prettier --write .
      - name: Regenerate repository indexes
        run: |
          python scripts/generate_test_index.py
          python scripts/generate_manifest.py
          git diff --check
      - name: Commit generated maintenance outputs
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Generated repository outputs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock chain/Cargo.lock package-lock.json crates services chain/programs apps/web docs/TEST_INDEX.md MANIFEST.sha256
          git commit -m "chore: sync generated repository artifacts"
          git push origin HEAD:"$GITHUB_REF_NAME"
