name: maintenance-sync
# Verifies that committed generated outputs (dependency locks, formatting, test index and
# manifest) are current. It never rewrites or pushes anything: dependency upgrades arrive as
# reviewed pull requests, and contributors regenerate outputs locally
# (scripts/bootstrap_dependencies.sh, scripts/generate_test_index.py,
# scripts/generate_manifest.py) before pushing.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:bookworm-20260918-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            sh -c "chown -R ${uid}:${gid} /workspace"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.13.15' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Verify pinned Node and npm
        run: |
          node --version | grep -Fx 'v24.21.0'
          npm --version | grep -Fx '11.19.0'
      - name: Committed dependency locks are current
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path chain/Cargo.toml >/dev/null
          npm ci --ignore-scripts
      - name: Rust workspaces are formatted
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path chain/Cargo.toml --all --check
      - name: Browser workspace is formatted
        run: npm --workspace @lastro/web exec -- prettier --check .
      - name: Repository indexes are current
        run: |
          python scripts/generate_test_index.py
          python scripts/generate_manifest.py
          git diff --check
          git diff --exit-code -- docs/TEST_INDEX.md MANIFEST.sha256
