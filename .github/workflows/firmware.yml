name: firmware
on:
  push:
    paths: ['firmware/**','.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**','.github/workflows/firmware.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify ESP-IDF toolchain
        run: idf.py --version
      - name: Configure ESP32-C5 target
        run: idf.py -C firmware/station set-target esp32c5
      - name: Build ESP32-C5 firmware
        run: |
          grep -Fx '# CONFIG_LASTRO_STATION_USE_EFUSE_KEY is not set' firmware/station/sdkconfig
          idf.py -C firmware/station build
      - name: Compile eFuse-backed signer configuration without provisioning
        env:
          SDKCONFIG_DEFAULTS: sdkconfig.defaults;sdkconfig.efuse.defaults
        run: |
          rm -rf firmware/station/build
          rm -f firmware/station/sdkconfig firmware/station/sdkconfig.old
          idf.py -C firmware/station set-target esp32c5
          grep -Fx 'CONFIG_MBEDTLS_HARDWARE_ECDSA_SIGN=y' firmware/station/sdkconfig
          grep -Fx 'CONFIG_LASTRO_STATION_USE_EFUSE_KEY=y' firmware/station/sdkconfig
          grep -Fx 'CONFIG_LASTRO_STATION_EFUSE_KEY_BLOCK_INDEX=0' firmware/station/sdkconfig
          idf.py -C firmware/station build
      - name: Hardware tests are intentionally not simulated
        run: echo "Unity target tests, physical RFID reader integration, and eFuse gates require declared ESP32-C5 hardware."
